name: Private existing-data API

on:
  pull_request:
    paths:
      - 'deploy/cloudflare-query/src/**'
      - 'scripts/private_serving_acceptance.py'
      - 'tests/unit/test_private*.py'
      - 'tests/unit/test_unified_research_api.py'
      - 'tests/unit/test_financial_certification.py'
      - 'tests/unit/test_valuation_engine*.py'
      - 'tests/unit/test_security_identity.py'
      - 'scripts/*unified*.py'
      - 'scripts/controlled_research_promotion.py'
      - 'scripts/audit_live_financial_certification.py'
      - 'scripts/correct_unified_research_summary.py'
      - 'tests/unit/test_live_financial_certification_audit.py'
      - 'tests/unit/test_financial_foundation.py'
      - 'tests/unit/test_sec_history*.py'
      - 'tests/unit/test_sec_engine*.py'
      - 'scripts/*sec_engine*.py'
      - 'tests/unit/test_sec_manifest_recovery.py'
      - 'contracts/sec-financial-metric-registry-v1.json'
      - 'src/zion_terminal/datasets/financial_foundation.py'
      - 'contracts/financial*'
      - 'contracts/fundamental*'
      - 'tests/unit/test_sec_expanded*.py'
      - 'scripts/publish_sec_expanded_index.py'
      - '.github/workflows/private-serving-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  existing-data-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test tools only
        run: python -m pip install 'pytest>=8,<10' 'ruff>=0.3,<1' 'click>=8,<9'
      - name: Synthetic existing-data and frozen contract tests
        run: >-
          python -m pytest -q
          tests/unit/test_sec_engine*.py
          tests/unit/test_sec_screener*.py
          tests/unit/test_sec_universe*.py
          tests/unit/test_sec_release*.py
          tests/unit/test_sec_publish_update_release.py
          tests/unit/test_sec_basin_optimize.py
          tests/unit/test_sec_balance_quality.py
          tests/unit/test_private_research_workflow.py
          tests/unit/test_unified_research_api.py
          tests/unit/test_unified_research_acceptance.py
          tests/unit/test_live_financial_certification_audit.py
          tests/unit/test_correct_unified_research_summary.py
          tests/unit/test_financial_certification.py
          tests/unit/test_valuation_engine*.py
          tests/unit/test_security_identity.py
          tests/unit/test_owner_market_release.py
          tests/unit/test_publish_unified_research_release.py
          tests/unit/test_controlled_research_promotion.py
          tests/unit/test_benchmark_unified_matched.py
          tests/unit/test_sec_incremental_update.py
          tests/unit/test_private_research_cli.py
          tests/unit/test_sec_history.py
          tests/unit/test_sec_history_api.py
          tests/unit/test_sec_manifest_recovery.py
          tests/unit/test_financial_foundation.py
          tests/unit/test_private_financials.py
          tests/unit/test_private_api.py
          tests/unit/test_private_api_routes.py
          tests/unit/test_private_dataset_proxy.py
          tests/unit/test_hosted_datasets_client.py
          tests/unit/test_collection_serving_acceptance.py
          tests/unit/test_publish_collection_catalog.py
          tests/unit/test_native_query_acceptance.py
          tests/unit/test_private_serving_acceptance.py
          tests/unit/test_tool_contract_v2.py
          tests/unit/test_serving_v2.py
          tests/unit/test_tool_contract_v3.py
          tests/unit/test_temporal_core.py
          tests/unit/test_market_data_api.py
          tests/unit/test_thin_compare.py
          tests/unit/test_sec_expanded.py
          tests/unit/test_sec_expanded_api.py
          tests/unit/test_sec_expanded_index.py
          tests/unit/test_sec_expanded_acceptance.py
      - name: Changed-module lint and syntax
        run: |
          ruff check deploy/cloudflare-query/src/private_*.py scripts/private_serving_acceptance.py tests/unit/test_private*.py deploy/cloudflare-query/src/sec_expanded*.py tests/unit/test_sec_expanded*.py scripts/publish_sec_expanded_index.py scripts/sec_expanded_acceptance.py scripts/collection_serving_acceptance.py scripts/datasets_client.py tests/unit/test_hosted_datasets_client.py tests/unit/test_collection_serving_acceptance.py scripts/publish_collection_catalog.py tests/unit/test_publish_collection_catalog.py scripts/native_query_acceptance.py tests/unit/test_native_query_acceptance.py
          ruff check deploy/cloudflare-query/src/sec_history*.py tests/unit/test_sec_history*.py tests/unit/test_sec_manifest_recovery.py scripts/*sec_history*.py scripts/sec_foundation_recovery.py scripts/provision_sec_read_token.py scripts/reconcile_sec_catalog_registration.py
          ruff check deploy/cloudflare-query/src/sec_engine*.py deploy/cloudflare-query/src/sec_screener*.py scripts/*sec_engine*.py scripts/sec_screener_acceptance.py scripts/sec_incremental_update.py tests/unit/test_sec_engine*.py tests/unit/test_sec_screener*.py tests/unit/test_sec_incremental_update.py src/zion_terminal/private_research.py
          ruff check deploy/cloudflare-query/src/sec_universe_screen.py scripts/sec_universe_pipeline.py scripts/sec_release_promotion.py scripts/sec_publish_update_release.py scripts/sec_research_workflow.py scripts/sec_basin_optimize.py scripts/sec_universe_basin.py scripts/sec_universe_live_acceptance.py deploy/cloudflare-query/src/sec_balance_quality.py tests/unit/test_sec_balance_quality.py tests/unit/test_sec_universe*.py tests/unit/test_sec_release*.py tests/unit/test_sec_publish_update_release.py tests/unit/test_sec_basin_optimize.py tests/unit/test_private_research_workflow.py
          ruff check deploy/cloudflare-query/src/unified_research_api.py deploy/cloudflare-query/src/financial_certification.py deploy/cloudflare-query/src/security_identity.py deploy/cloudflare-query/src/valuation_engine.py scripts/controlled_research_promotion.py scripts/prepare_owner_market_release.py scripts/publish_unified_research_release.py scripts/benchmark_unified_matched.py tests/unit/test_unified_research_api.py tests/unit/test_financial_certification.py tests/unit/test_security_identity.py tests/unit/test_valuation_engine*.py tests/unit/test_controlled_research_promotion.py tests/unit/test_owner_market_release.py tests/unit/test_publish_unified_research_release.py tests/unit/test_benchmark_unified_matched.py
          python -m py_compile deploy/cloudflare-query/src/private_*.py deploy/cloudflare-query/src/thin_worker.py scripts/private_serving_acceptance.py
      - name: Frozen contract unchanged
        run: |
          python scripts/generate_tool_contract.py
          git diff --exit-code -- contracts/zion-tool-contract-v2.json contracts/zion-tool-contract-v2.sha256
          git diff --check
