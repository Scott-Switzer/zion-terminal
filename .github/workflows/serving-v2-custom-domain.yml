name: Serving V2 Custom Domain Smoke

on:
  workflow_dispatch:
    inputs:
      samples:
        description: Number of warm Q1 samples
        required: false
        default: "50"
      base_url:
        description: Canonical staging serving URL
        required: false
        default: "https://api-thin-staging.scotttunnel.xyz"
      symbol:
        description: Coverage-25 symbol to smoke
        required: false
        default: "MSFT"
      expected_release:
        description: Optional exact serving release ID
        required: false
        default: "895eb69371fa2e944eed20463f7f9fc2"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  custom-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: ${{ inputs.base_url || 'https://api-thin-staging.scotttunnel.xyz' }}
      SYMBOL: ${{ inputs.symbol || 'MSFT' }}
      EXPECTED_RELEASE: ${{ inputs.expected_release || '895eb69371fa2e944eed20463f7f9fc2' }}
      EXPECTED_CONTRACT: 763e01d48975d02532224de73d668952bc33a199021654b5653b6c6bff9235f8
      EXPECTED_TEMPORAL: 5d225691cb60251d1997bb8d749267da845f0b3cda32137cbf76c3fbd2783b1d
      SAMPLES: ${{ inputs.samples || '50' }}
    steps:
      - name: TLS and health checks
        shell: bash
        run: |
          set -euo pipefail
          getent ahosts "$BASE_URL" || true
          curl --fail-with-body --silent --show-error --verbose --tlsv1.2 "$BASE_URL/healthz" -o /tmp/health-tls12.json 2>/tmp/curl-tls12.log
          curl --fail-with-body --silent --show-error --verbose --tlsv1.3 "$BASE_URL/healthz" -o /tmp/health-tls13.json 2>/tmp/curl-tls13.log
          grep -E 'SSL connection using|subject:|issuer:|HTTP/|cf-ray|CF-Ray' /tmp/curl-tls12.log || true
          grep -E 'SSL connection using|subject:|issuer:|HTTP/|cf-ray|CF-Ray' /tmp/curl-tls13.log || true
          cat /tmp/health-tls12.json
      - name: Capability and route contract preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          base = os.environ["BASE_URL"]
          def get(path):
              request = urllib.request.Request(base + path, headers={"user-agent":"github-actions-serving-v2/2.0"})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.status, dict(response.headers), response.read()
              except urllib.error.HTTPError as error:
                  return error.code, dict(error.headers), error.read()
          status, headers, raw = get("/v1/capabilities")
          try: document = json.loads(raw)
          except Exception: document = {"raw": raw[:500].decode(errors="replace")}
          tools = document.get("tools", {}) if isinstance(document, dict) else {}
          print(json.dumps({"url": base + "/v1/capabilities", "status": status, "cf_ray": headers.get("cf-ray"), "service_version": document.get("service_version"), "temporal_contract": document.get("temporal_contract_sha256"), "tools": sorted(tools)}, sort_keys=True))
          if status != 200 or "get_fundamentals" not in tools:
              raise SystemExit("CONTRACT_MISMATCH: get_fundamentals is not advertised by the target")
          PY
      - name: V2 capabilities and MCP preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          base = os.environ['BASE_URL']
          with urllib.request.urlopen(base + '/v2/capabilities', timeout=30) as response:
              document = json.loads(response.read())
          names = {tool['name'] for tool in document.get('tools', [])}
          expected = {'resolve_entity','resolve_security','get_fundamentals','get_price','get_price_history','get_corporate_actions','get_revision_history','get_evidence','compare','calculate','screen'}
          if response.status != 200 or names != expected or document.get('tool_contract_sha256') != os.environ['EXPECTED_CONTRACT'] or document.get('temporal_contract_sha256') != os.environ['EXPECTED_TEMPORAL'] or document.get('serving_release_id') != os.environ['EXPECTED_RELEASE']:
              raise SystemExit({'status': response.status, 'names': sorted(names), 'document': document})
          print(json.dumps({'status': response.status, 'git_sha': document.get('git_sha'), 'service_version': document.get('service_version'), 'release': document.get('serving_release_id'), 'contract': document.get('tool_contract_sha256')}))
          PY
          printf '%s' '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' | curl --fail-with-body --silent --show-error -X POST "$BASE_URL/mcp" -H 'content-type: application/json' --data-binary @- | python3 -c 'import json,sys; x=json.load(sys.stdin); assert len(x["result"]["tools"]) == 11; print(json.dumps({"mcp_tools":len(x["result"]["tools"])}))'
      - name: OpenSSL certificate check
        shell: bash
        run: |
          set -euo pipefail
          openssl s_client -connect api-staging.scotttunnel.xyz:443 -servername api-staging.scotttunnel.xyz -tls1_2 </dev/null 2>/tmp/openssl.log | openssl x509 -noout -subject -issuer -dates -ext subjectAltName
          grep -E 'Protocol|Cipher|Verify return code' /tmp/openssl.log || true
      - name: Warm Q1 benchmark
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, statistics, time, urllib.error
          from urllib.request import Request, urlopen
          base = os.environ["BASE_URL"]
          symbol = os.environ["SYMBOL"]
          expected_release = os.environ["EXPECTED_RELEASE"]
          n = int(os.environ["SAMPLES"])
          body = json.dumps({"entity":symbol,"metrics":["revenue"],"period":"annual","lookback":1,"world":{"world_type":"real","world_id":"us-public-markets"}}).encode()
          rows = []
          for i in range(n):
              request = Request(base + "/v1/tools/get_fundamentals", data=body, headers={"content-type":"application/json", "user-agent":"github-actions-serving-v2/2.0", "x-request-id":f"gha-q1-{i}"})
              started = time.perf_counter()
              try:
                  with urlopen(request, timeout=30) as response:
                      payload = response.read(); headers = dict(response.headers); status = response.status
              except urllib.error.HTTPError as error:
                  payload = error.read(); headers = dict(error.headers); status = error.code
                  print(json.dumps({"contract_failure": True, "url": request.full_url, "path": request.selector, "status": status, "cf_ray": headers.get("cf-ray"), "body": payload[:1000].decode(errors="replace")}, sort_keys=True))
                  raise
              elapsed = (time.perf_counter() - started) * 1000
              document = json.loads(payload)
              telemetry = document.get("release", {}).get("serving_telemetry", {})
              telemetry["serving_release_id"] = document.get("release", {}).get("serving_release_id")
              rows.append({"ms": elapsed, "status": status, "bytes": len(payload), "ray": headers.get("cf-ray"), "telemetry": telemetry})
          values = sorted(row["ms"] for row in rows)
          def pct(p): return values[min(len(values)-1, max(0, int(len(values)*p)-1))]
          print(json.dumps({"samples": n, "p50_ms": round(statistics.median(values), 2), "p90_ms": round(pct(.90), 2), "p95_ms": round(pct(.95), 2), "p99_ms": round(pct(.99), 2), "max_ms": round(max(values), 2), "statuses": sorted(set(row["status"] for row in rows)), "serving_release_ids": sorted({row["telemetry"].get("serving_release_id") for row in rows if row["telemetry"].get("serving_release_id")}), "cache_hits": sum(row["telemetry"].get("cache_hits", 0) for row in rows), "cache_misses": sum(row["telemetry"].get("cache_misses", 0) for row in rows), "r2_gets": sum(row["telemetry"].get("r2_gets", 0) for row in rows), "timing_samples": [row["telemetry"].get("timing_ms", {}) for row in rows[:3]]}, sort_keys=True))
          releases = sorted({row["telemetry"].get("serving_release_id") for row in rows if row["telemetry"].get("serving_release_id")})
          if any(row["status"] != 200 for row in rows): raise SystemExit("non-200 response")
          if expected_release and releases != [expected_release]: raise SystemExit(f"RELEASE_MISMATCH: expected {expected_release}, observed {releases}")
          PY
